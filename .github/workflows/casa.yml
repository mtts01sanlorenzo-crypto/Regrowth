name: casa-test
on: [push]
jobs:
  casa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: chmod +x ./gradlew
      - name: test datapack
        run: |
          mkdir -p run/world/datapacks && cp -r casa_dp run/world/datapacks/casa && echo eula=true > run/eula.txt
          ( sleep 60
            echo "forceload add -32 64 48 160"; sleep 15
            echo "datapack list"; sleep 2
            echo "execute positioned 9 200 100 run function casa:construir"; sleep 15
            echo "function casa:verify"; sleep 10
            echo stop ) | timeout 420 ./gradlew runServer --console=plain > server.log 2>&1 || true
          echo "===== FAIL ====="; grep -c "FAIL" server.log || true
          grep -E "FAIL|OKDOOR|OKPORCH" server.log | grep -v server.properties | sort | uniq -c | head -40
          echo "===== air head counts ====="; grep -oE "OKAIR[12]_[0-9]+_[0-9]+_[0-9]+" server.log | sort -u | wc -l
          echo "===== datapack ====="; grep -E "data pack" server.log | head
