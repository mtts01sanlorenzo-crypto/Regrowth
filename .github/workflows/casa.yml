name: casa-test
on: [push]
jobs:
  casa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: test datapack
        run: |
          echo eula=true > run/eula.txt
          ( sleep 60
            echo "forceload add -20 60 30 100"; sleep 15
            echo "datapack list"; sleep 2
            echo "execute positioned -15 200 65 run function casa:construir"; sleep 15
            echo "execute if block -5 201 79 minecraft:spruce_door run say CHECK_door_ok"; sleep 1
            echo "execute if block -14 201 66 minecraft:campfire run say CHECK_campfire_ok"
            echo "execute if block -8 200 70 minecraft:water run say CHECK_water_dummy"
            echo "execute if entity @e[type=minecraft:wolf] run say CHECK_wolf_ok"
            echo "execute if entity @e[type=minecraft:cat] run say CHECK_cat_ok"
            echo "execute if entity @e[type=minecraft:cow] run say CHECK_cow_ok"
            sleep 3
            echo stop ) | timeout 420 ./gradlew runServer --console=plain > server.log 2>&1 || true
          grep -iE "casa|function|datapack|pack|Unknown|Expected|Incorrect|CHECK|exception|error|Failed|Executed" server.log | grep -v "server.properties" | head -120
