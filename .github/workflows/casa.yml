name: casa-test
on: [push]
jobs:
  casa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: chmod +x ./gradlew
      - name: test datapack
        run: |
          mkdir -p run/world/datapacks && cp -r casa_dp run/world/datapacks/casa && echo eula=true > run/eula.txt
          ( sleep 60
            echo "forceload add -16 96 64 176"; sleep 15
            echo "execute positioned 9 200 120 run function casa:construir"; sleep 18
            echo "function casa:verify"; sleep 10
            echo stop ) | timeout 440 ./gradlew runServer --console=plain > server.log 2>&1 || true
          echo "FAILCOUNT:"; grep -c "] FAIL" server.log || true
          grep -E "\] FAIL|OKDOOR|OKFRAME|Unknown|Expected|argument|Incorrect" server.log | grep -v server.properties | sort | uniq -c | head -50
