name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain > build.log 2>&1 || RC=$?
          grep -E "error:|symbol:|location:|BUILD|FAILED|What went wrong" build.log | head -200
          exit ${RC:-0}
      - name: block class check
        run: |
          J=$(find ~/.gradle/caches -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          javap -c -p -cp $J net.minecraft.world.level.block.Blocks > /tmp/blocks.txt
          for n in short_grass tall_grass short_dry_grass tall_dry_grass leaf_litter fern; do echo "== $n"; grep -A8 "ldc.*String $n\b" /tmp/blocks.txt | grep -E "new|ldc" | head -4; done
      - name: server smoke test
        run: |
          mkdir -p run && echo eula=true > run/eula.txt
          (sleep 110; echo stop) | timeout 300 ./gradlew runServer --console=plain > server.log 2>&1 || true
          grep -iE "regrowth|mixin|exception|error|Done \(|Loading Minecraft|Loader" server.log | head -80
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Regrowth-fabric-26.3
          path: build/libs/*.jar
