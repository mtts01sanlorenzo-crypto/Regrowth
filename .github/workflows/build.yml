name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain > build.log 2>&1 || RC=$?
          grep -E "error:|symbol:|location:|BUILD|FAILED|What went wrong" build.log | head -200
          exit ${RC:-0}
      - name: gameplay test (villager on grass)
        run: |
          mkdir -p run/config && echo eula=true > run/eula.txt && printf 'debugLevel=2\n' > run/config/regrowth.properties
          ( sleep 50
            echo "forceload add 0 0"; sleep 8
            echo "setblock 0 120 0 minecraft:grass_block"
            echo "setblock 0 121 0 minecraft:short_grass"
            echo "summon minecraft:villager 0.5 121 0.5"
            sleep 45
            echo "data get entity @e[type=minecraft:villager,limit=1] Pos"
            sleep 3
            echo stop ) | timeout 300 ./gradlew runServer --console=plain > server.log 2>&1 || true
          grep -iE "grass cut|regrowth|Reg-|L1|L2|exception|error|Villager|Pos" server.log | grep -v server.properties | head -60
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Regrowth-fabric-26.3
          path: build/libs/*.jar
